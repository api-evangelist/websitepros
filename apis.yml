  omitted_deliberately:
    WellKnown: >-
      Every /.well-known/ path 404d on all five reachable Web.com hosts (403 behind a Cloudflare bot
      challenge on www.web.com). See well-known/websitepros-well-known.yml — a recorded absence, not
      a served surface.
    SecurityTxt: No security.txt is served on any Web.com host.
    AgentCard: >-
      /.well-known/agent-card.json and /.well-known/agent.json missed on every host. Nothing was
      authored; there is no a2a/ directory.
    Idempotency: >-
      Web.com publishes no Idempotency-Key support and no retry-safety statement. conventions/
      records the absence explicitly.
    SDKs: No first-party client library exists in any registry searched.
    OAuthScopes: >-
      The oauth2 scheme is real (Entra ID client credentials) but has ZERO scopes — the v1 token
      endpoint takes a `resource` audience instead. An empty scopes artifact was generated and then
      removed rather than published as a scope surface; authentication/ carries the model.
    StatusPage: >-
      status.web.com resolves but returned 403 behind a Cloudflare bot challenge, and no status page
      is linked from the API documentation. Presence could not be verified.
    Deprecation: No deprecation or sunset policy is published for this API.
    Compliance: No trust center or named certification could be verified.
    Security: >-
      No security.txt, disclosure policy or bug-bounty program was found on any reachable Web.com
      host.
    ChangeLog: No dated changelog or release notes exist for this API.
    CLI: No first-party CLI.
    AsyncAPI/Webhooks: No event, webhook, callback or streaming surface is documented.
    GitHubOrganization: >-
      github.com/webdotcom belongs to an unrelated company ("Web dot Com Website Development
      Philippines Inc.", 0 repos); github.com/newfold-digital is 404.
    Pricing/TermsOfService/PrivacyPolicy: >-
      These pages live on www.web.com, which answers HTTP 403 to every anonymous request behind a
      Cloudflare bot challenge. Not asserted without verification.
