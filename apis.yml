description: >-
  WebsitePros, now operating as Web.com, is an American company that provides
  website building, web hosting, domain registration, e-commerce, and online
  marketing services primarily to small and medium-sized businesses. Website
  Pros, Inc. merged with Web.com in 2007 and adopted the Web.com name. The
  business offers do-it-yourself and do-it-for-you website builders, managed
  WordPress hosting, professional email, SEO and digital marketing tools, and is
  headquartered in Jacksonville, Florida. As surfaced through a VC-portfolio
  match, it currently exposes no public developer API or documented developer
  portal.
