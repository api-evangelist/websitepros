name: WebsitePros
description: >-
  WebsitePros, now operating as Web.com, is an American company that provides website building, web
  hosting, domain registration, e-commerce, and online marketing services primarily to small and
  medium-sized businesses. Website Pros, Inc. merged with Web.com in 2007 and adopted the Web.com
  name, and the business is now part of Newfold Digital, formed in 2021 from Endurance Web Presence
  and Web.com Group. It offers do-it-yourself and do-it-for-you website builders, managed WordPress
  hosting, professional email, SEO and digital marketing tools, and is headquartered in
  Jacksonville, Florida. Behind the retail brand it runs a real partner-facing B2B API — the Web.com
  International ("NTS") Platform API, fronted by Azure API Management at api.nts.web.com and
  documented publicly at api-docs.intl.web.com — through which approved resellers and sales partners
  create and manage sales orders, provision service orders, check domain availability and mint
  customer single-sign-on URLs. Access is not self-service: registration is reviewed and approved by
  the Web.com International team, separately for the production and development environments.
