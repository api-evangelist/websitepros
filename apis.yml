apis:
- aid: websitepros:international-platform
  name: Web.com International Platform API
  description: >-
    The partner-facing API for Web.com's International ("NTS") platform, fronted by Azure API
    Management. Ten documented operations cover the sales-order lifecycle (create, list with paging
    and filtering, read, merge-update, delete), service-order provisioning of products and their
    product-specific service configurations, domain availability checking and name suggestion, a
    customer single-sign-on URL generator, and a healthcheck. Every request carries three
    credentials together — an Azure API Management subscription key, a Microsoft Entra ID
    client-credentials bearer token, and a tenant identifier. Production and development are
    separate gateways with separate registrations and separate keys. Web.com publishes no OpenAPI;
    its published machine-readable contract is the public Postman collection saved verbatim in this
    repository.
  humanURL: https://api-docs.intl.web.com/
