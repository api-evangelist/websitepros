note: >-
  Derived from the request bodies Web.com publishes in its own Postman collection. Response shapes
  are not represented because Web.com publishes none and the live surface is gated, so the graph
  below describes what a caller must SEND, not what the API returns.
entities:
  - name: SalesOrder
    description: A pipeline record combining a customer, an account, contacts, products and payment terms.
    schema: '#/components/schemas/SalesOrder'
    operations: [createSalesOrder, listSalesOrders, getSalesOrderById, updateSalesOrder, deleteSalesOrder]
    identifier: salesOrderId
  - name: Customer
    description: The buying party. An empty `id` means "create a new customer".
    schema: '#/components/schemas/Customer'
    identifier: id
  - name: Account
    description: The container products are placed on. An empty `id` means "create a new account".
    schema: '#/components/schemas/Account'
    identifier: id
  - name: Contact
    description: A named person on the order, with one or more roles.
    schema: '#/components/schemas/Contact'
  - name: Product
    description: A line item with quantity, discount and service-agreement term.
    schema: '#/components/schemas/Product'
  - name: Note
    description: A free-text note attributed to a username.
    schema: '#/components/schemas/Note'
  - name: PaymentSummary
    description: Currency, invoice delivery method, payment terms and payment type.
    schema: '#/components/schemas/PaymentSummary'
  - name: SalesOrderStatus
    description: Pipeline phase plus the sales partner and sales rep the order is attributed to.
    schema: '#/components/schemas/SalesOrderStatus'
  - name: ServiceOrder
    description: A provisioning instruction attaching product actions to a customer and account.
    schema: '#/components/schemas/ServiceOrder'
    operations: [createServiceOrders]
  - name: ServiceOrderAction
    description: One `create` action naming a product and a product-specific services map.
    schema: '#/components/schemas/ServiceOrderAction'
  - name: Domain
    description: >-
      A domain name tested for availability or generated as a suggestion. Not a persisted resource
      in this API — there is no domain read/update/delete surface, only check and spin.
    operations: [checkDomainAvailability, spinDomainSuggestions]
