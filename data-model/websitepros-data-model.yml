tenancy:
  root: Tenant
  note: >-
    Every entity is scoped to the caller's tenant, asserted by the x-nts-tenant-id or tenant-name
    header rather than by anything in the payload. The SSO operation is explicitly scoped — "any
    given customer owned by your tenant".
divergences:
  - >-
    Two different Customer shapes exist. The sales-order Customer carries username, companyName,
    customerType and legalId; the service-order customer carries accountManagerUsername,
    accountManagerPassword and companyPositionHeld instead. They are not the same schema even
    though both are called the customer.
  - >-
    Product quantity is `quantity` in the published create example and `qty` in the published
    update example.
identifiers:
  format: opaque hexadecimal string
  observed_lengths: [8, 32]
  note: >-
    8-hex-character ids in the sales-order examples, 32-hex-character ids in the service-order
    examples. Web.com documents no id format or prefix scheme.
